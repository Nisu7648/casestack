# ============================================
# RENDER.COM DEPLOYMENT CONFIGURATION
# Free tier deployment for CASESTACK
# ============================================

services:
  # Backend API Service
  - type: web
    name: casestack-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: casestack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: casestack-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://casestack-backend.onrender.com

databases:
  # PostgreSQL Database (Free tier)
  - name: casestack-db
    databaseName: casestack
    user: casestack_user
    plan: free
    region: oregon
